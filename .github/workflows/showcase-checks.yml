name: Soul Snap portfolio checks
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate repository layout and Markdown links
        run: python3 scripts/validate_showcase.py
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Compile and check independent portfolio contracts
        run: dotnet run --project samples/independent-models/IndependentModels.csproj --configuration Release
